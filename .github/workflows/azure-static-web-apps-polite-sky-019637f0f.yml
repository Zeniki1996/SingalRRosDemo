name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - robot_ui_&_backend_v2
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - robot_ui_&_backend_v2

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    env:
      REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
      REACT_APP_OPENAI_API_KEY: ${{ secrets.REACT_APP_OPENAI_API_KEY }}
      REACT_APP_PORCUPINE_KEY: ${{ secrets.REACT_APP_PORCUPINE_KEY }}

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Debug Environment Variables
      - name: Debug Environment Variables
        run: |
          echo "BACKEND_URL=$REACT_APP_BACKEND_URL"
          echo "OPENAI_API_KEY=$REACT_APP_OPENAI_API_KEY"
          echo "PORCUPINE_KEY=$REACT_APP_PORCUPINE_KEY"
          # Nota: No hagas echo de secretos reales en un entorno público.

      # Install dependencies and build the app
      - name: Install Dependencies
        run: |
          cd ./RSInterfaz
          npm install
          npm run build

      # Deploy to Azure Static Web Apps
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_SKY_019637F0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./RSInterfaz" # App source code path
          api_location: ""            # Api source code path - optional
          output_location: "build"    # Built app content directory - optional

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_SKY_019637F0F }}
          action: "close"
